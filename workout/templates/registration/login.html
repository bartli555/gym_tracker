<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Twierdza Krzyżowiec - Logowanie</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                background-color: #e9ecef;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        </style>    
    </head>
        <body>
            <div class="card shadow-lg p-5 border-0 rounded-4" style="width: 100%; max-width: 450px;">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark mb-1">Gym Tracker</h2>
                    <p class="text-muted">Wymagana autoryzacja</p>
                </div>

                <!-- W przypadku podania złych danych, Django automatycznie wyśle tu zmienną form.errors -->
                 {% if form.errors %}
                    <div class="alert alert-danger text-center fw-bold py-2">
                        Nieprawidłowy login lub hasło
                    </div>
                 {% endif %}
                 
                 <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted small text-uppercase">Identyfikator</label>
                        <input type="text" name="username" class="form-control form-control-lg border-dark" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold text-muted small text-uppercase">Hasło dostępowe</label>
                        <input type="password" name="password" class="form-control form-control-lg border-dark" required>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold shadow-sm">Uzyskaj dostęp</button>
                 </form>
            </div>
        </body>   
</html>
