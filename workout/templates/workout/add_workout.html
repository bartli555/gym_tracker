<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>Dodaj Krenink</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
        <body class="bg-light">
            <div class="container mb-5" style="max-width: 600px;">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Otwórz nowy dzień kreningowy</h4>
                    </div>
                    <div class="card-body">
                        <!-- Formularz --->
                         <form method="post">
                            {% csrf_token %} <!-- zabezpieczenie przed hakerami xd --->

                            <div class="mb-3">
                                <label class="form-label fw-bold">Data treningu</label>
                                {{ form.date }}
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold"> Trenowana partia</label>
                                {{ form.target_muscle }}
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-succes btn-lg">Rozpocznij trenink</button>
                                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Anuluj</a>
                            </div>
                         </form>
                    </div>
                </div>
            </div>
        </body>
</html>
