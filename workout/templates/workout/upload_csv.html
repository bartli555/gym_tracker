<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gym Tracker - Import danych z Hevy</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <style>
            body {
                background-image: 
                    linear-gradient(rgba(240, 245, 245, 0.85), rgba(240, 245, 245, 0.85)), 
                    url('https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Arnold_Schwarzenegger_1974.jpg/500px-Arnold_Schwarzenegger_1974.jpg');
                background-size: cover;
                background-position: center top;
                background-attachment: fixed;
                background-repeat: no-repeat;
            }
        </style>
    </head>
    <body>
        <div class="container mt-5">
            <div class="row justify-content-center mt-5">
                <div class="col-md-6 mt-4">
                    
                    <div class="card shadow-lg border-0">
                        <div class="card-header bg-dark text-white text-center py-3">
                            <h4 class="mb-0 fw-bold">Import bazy treningowej</h4>
                        </div>
                        <div class="card-body p-4 bg-light">
                            <!-- WAŻNE: enctype="multipart/form-data" jest niezbędne przy plikach! -->
                            <form method="POST" enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="mb-4">
                                    <label for="csvFile" class="form-label fw-bold text-dark">Wybierz wyeksportowany plik CSV z Hevy:</label>
                                    <input class="form-control form-control-lg border-dark" type="file" id="csvFile" name="csv_file" accept=".csv" required>
                                    <div class="form-text mt-2">
                                        System automatycznie odrzuci duplikaty. Bez obaw – możesz wgrać ten sam plik wielokrotnie, a zapiszą się tylko nowe serie.
                                    </div>
                                </div>
                                <div class="d-grid mt-4">
                                    <button type="submit" class="btn btn-danger btn-lg fw-bold shadow-sm">Rozpocznij import danych</button>
                                </div>
                            </form>
                        </div>
                    </div>
                    
                    <div class="mt-4 text-center">
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-dark fw-bold shadow-sm px-4">Anuluj i wróć do Dashboardu</a>
                    </div>
                    
                </div>
            </div>
        </div>
    </body>
</html>
