name: Automatyczny Dashboard Treningowy

on:
  push:
    branches:
      - main # Zmieniamy na 'master', jeśli tak nazywa się główna gałąź

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v3

      - name: Instalacja Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: pip install -r requirements.txt

      - name: Generowanie nowego radaru
        run: python generator.py

      - name: Zapisanie i nadpisanie plików na stronie
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Automatyczna aktualizacja dashboardu przez CI/CD" || echo "Brak zmian do zapisu"
          git push